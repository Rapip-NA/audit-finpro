name: Deploy Laravel via SSH & Tar Archive

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: 🚀 Build & Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: 🛎 Checkout code
        uses: actions/checkout@v4

      # ── 1. Setup PHP & Composer ──────────────────────────────────────
      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3, pdo_sqlite, zip, curl, xml, dom, pcntl, posix, fileinfo
          tools: composer:v2
          coverage: none

      - name: 📄 Temporary Local Env for Build
        run: cp .env.example .env

      - name: 📦 Install Composer dependencies (production)
        run: |
          composer config platform-check false
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress --ignore-platform-reqs
        env:
          COMPOSER_MEMORY_LIMIT: -1

      # ── 2. Setup Node.js & Build Vite Assets ──────────────────────────
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install npm dependencies & Build Vite
        run: |
          npm install --ignore-scripts
          npm run build

      # ── 3. Compress Project into Single Tar Archive ───────────────────
      # Simpan di /tmp agar tidak bentrok dengan pembacaan folder direktori saat ini
      - name: 🗜 Compress project files
        run: |
          tar -czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='.env' \
            --exclude='.env.*' \
            .
          mv /tmp/deploy.tar.gz ./deploy.tar.gz
          ls -lh deploy.tar.gz

      # ── 4. Upload Archive via SCP ────────────────────────────────────
      - name: 📤 Upload tar.gz via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST || 'rapipaja.my.id' }}
          username: ${{ secrets.SSH_USERNAME || 'rapipaja' }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: 'deploy.tar.gz'
          target: '/home/rapipaja'

      # ── 5. Extract & Run Artisan on Server via SSH ────────────────────
      - name: 🛠 Extract & Run Laravel Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || 'rapipaja.my.id' }}
          username: ${{ secrets.SSH_USERNAME || 'rapipaja' }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            # 1. Cari file archive deploy.tar.gz
            ARCHIVE=""
            for a in /home/rapipaja/deploy.tar.gz "$HOME/deploy.tar.gz" ./deploy.tar.gz; do
              if [ -f "$a" ]; then
                ARCHIVE="$a"
                break
              fi
            done

            if [ -z "$ARCHIVE" ]; then
              echo "❌ File deploy.tar.gz tidak ditemukan di server!"
              exit 1
            fi

            echo "📦 Ditemukan archive: $ARCHIVE"

            # 2. Target folder sesuai domain di server DirectAdmin / cPanel
            TARGET_DIR="/home/rapipaja/domains/audit.rapipaja.my.id/public_html"
            if [ ! -d "$TARGET_DIR" ]; then
              if [ -d "$HOME/domains/audit.rapipaja.my.id/public_html" ]; then
                TARGET_DIR="$HOME/domains/audit.rapipaja.my.id/public_html"
              else
                mkdir -p "$TARGET_DIR"
              fi
            fi

            echo "📂 Target Directory: $TARGET_DIR"

            # 3. Ekstrak archive langsung ke target folder
            tar -xzf "$ARCHIVE" -C "$TARGET_DIR"
            rm -f "$ARCHIVE"

            cd "$TARGET_DIR"

            # 4. Pastikan file .env ada
            if [ ! -f .env ] && [ -f .env.example ]; then
              cp .env.example .env
              echo "📄 Dibuat file .env baru dari .env.example"
            fi

            # 5. Pastikan folder storage & cache ada serta memiliki permission
            mkdir -p storage/framework/{sessions,views,cache/data} storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache || true

            # 6. Deteksi binary PHP >= 8.3 di server
            PHP_BIN=""
            for p in /usr/local/php84/bin/php /usr/local/php83/bin/php /usr/bin/ea-php84 /usr/bin/ea-php83 /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php /usr/local/bin/php84 /usr/local/bin/php83 $(which php8.4 2>/dev/null) $(which php8.3 2>/dev/null) $(which php); do
              if [ -x "$p" ]; then
                V=$("$p" -r 'echo PHP_VERSION_ID;' 2>/dev/null || echo 0)
                if [ "$V" -ge 80300 ]; then
                  PHP_BIN="$p"
                  break
                fi
              fi
            done

            if [ -z "$PHP_BIN" ]; then
              PHP_BIN=$(which php)
            fi

            echo "🐘 PHP binary: $PHP_BIN ($($PHP_BIN -v | head -n 1))"

            # 7. Jalankan Artisan
            $PHP_BIN artisan storage:link || true
            $PHP_BIN artisan migrate --force || true
            $PHP_BIN artisan config:clear || true
            $PHP_BIN artisan route:clear || true
            $PHP_BIN artisan view:clear || true

            echo "✅ DEPLOYMENT BERHASIL! File telah masuk ke $TARGET_DIR"
